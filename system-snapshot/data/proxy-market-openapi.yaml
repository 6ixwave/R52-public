openapi: 3.0.0
info:
  title: pm API
  version: '1.1'
servers:
  - url: https://api.dashboard.proxy.market
    description: server
paths:
  /dev-api/balance/{api_key}:
    get:
      tags:
        - API
      summary: Current balance
      operationId: balance
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  balance:
                    type: number
                    example: 10
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/list/{api_key}:
    post:
      tags:
        - API
      summary: Get proxy list
      operationId: proxiesList
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              properties:
                type:
                  description: Tariff
                  type: string
                  enum:
                    - ipv4
                    - ipv4-shared
                    - ipv6
                    - all
                  example: ipv4
                proxy_type:
                  description: Proxy type. Not required when package_id is provided.
                  type: string
                  enum:
                    - mobile
                    - server
                    - resident
                  example: server
                page:
                  description: Page number
                  type: integer
                  example: 1
                page_size:
                  description: Number of proxies per page
                  type: integer
                  example: 10
                sort:
                  description: 0 - newest first, 1 - oldest first
                  type: integer
                  example: 1
                package_id:
                  description: Traffic package ID
                  type: integer
                  example: 1
                order_id:
                  description: Order ID
                  type: integer
                  example: 1
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  balance:
                    type: number
                    example: 1.5
                  list:
                    properties:
                      error:
                        type: boolean
                        example: false
                      total:
                        type: integer
                        example: 1
                      page_size:
                        type: integer
                        example: 1
                      data:
                        type: array
                        items:
                          properties:
                            id:
                              description: Proxy ID
                              type: integer
                              example: 1
                            ip:
                              description: id
                              type: string
                              example: 127.0.0.1
                            ip_out:
                              description: id
                              type: string
                              example: 2ad2::1212::23c1::93wq
                            http_port:
                              description: HTTP port
                              type: integer
                              example: 80
                            socks_port:
                              description: SOCKS port
                              type: integer
                              example: 81
                            login:
                              description: Login
                              type: string
                              example: test_login
                            password:
                              [REDACTED_AUTH_SECRET]
                              type: string
                              example: test_password
                            comment:
                              description: Comment
                              type: string
                              example: For purchase testing
                            country:
                              description: Country
                              type: string
                              example: ru
                            expires_at:
                              description: Expiration date
                              type: string
                              example: '2030-01-01'
                            is_hidden:
                              description: Hidden
                              type: integer
                              example: 0
                            attached_ip:
                              description: Attached IP
                              type: string
                              example: 127.0.0.1
                            bought_at:
                              description: Purchase date
                              type: string
                              example: '2021-08-01 20:00:00'
                            type:
                              description: Tariff
                              type: string
                              example: ipv4
                            proxy_type:
                              description: Proxy type
                              type: string
                              example: server
                            rotation_settings:
                              description: Rotation settings. Null when rotation is not available.
                              type: object
                              nullable: true
                              properties:
                                rotate:
                                  description: Current rotation interval in minutes. -1 = sticky session, 0 = disabled, positive value = every N minutes.
                                  type: integer
                                  example: 15
                                rotate_min:
                                  description: Minimum custom rotation interval in minutes.
                                  type: integer
                                  example: 5
                                rotate_max:
                                  description: Maximum custom rotation interval in minutes.
                                  type: integer
                                  example: 60
                                rotate_can_change:
                                  description: Whether the rotation interval can be changed.
                                  type: boolean
                                  example: true
                                change_ip_link:
                                  description: Link for manual IP change, if available.
                                  type: string
                                  nullable: true
                                  example: https://api.dashboard.proxy.market/change-proxy-ip/eyJpdiI6Ik1qY2...
                                can_disable:
                                  description: Whether automatic rotation can be disabled with rotate = 0.
                                  type: boolean
                                  example: true
                          type: object
                    type: object
                type: object
        '400':
          description: Error
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Error message
                    description: Error message
                    format: string
                    example: The limit field is required.
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/buy-proxy/{api_key}:
    post:
      tags:
        - API
      summary: Buy proxies
      operationId: buyProxies
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                PurchaseBilling:
                  properties:
                    count:
                      type: integer
                      example: 1
                    duration:
                      type: integer
                      enum:
                        - 30
                        - 60
                        - 90
                        - 180
                        - 360
                      example: 30
                    type:
                      description: 100 - ivp4, 101 - ipv6
                      type: integer
                      enum:
                        - 100
                        - 101
                      example: 101
                    country:
                      type: string
                      enum:
                        - ru
                      example: ru
                    promocode:
                      type: string
                      example: test
                    speed:
                      description: Speed (1 - 0.75 MB, 2 - 5 MB, 3 - 15 MB) (IPv6 only)
                      type: integer
                      enum:
                        - 1
                        - 2
                        - 3
                      example: 1
                  type: object
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  balance:
                    type: number
                    example: 1.5
                  code:
                    type: string
                    enum:
                      - LOW_BALANCE
                    example: LOW_BALANCE
                  order_id:
                    type: integer
                    example: 1
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/prolong/{api_key}:
    post:
      tags:
        - API
      summary: Prolong proxies
      operationId: prolongProxies
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                ProlongationForm:
                  properties:
                    duration:
                      type: integer
                      enum:
                        - 30
                        - 60
                        - 90
                        - 180
                        - 360
                      example: 30
                    promocode:
                      type: string
                      example: test
                    proxies:
                      description: Comma-separated proxy IDs
                      type: string
                      example: 1,2,3
                  type: object
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  balance:
                    type: number
                    example: 1.5
                  code:
                    type: string
                    enum:
                      - LOW_BALANCE
                    example: LOW_BALANCE
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/change-rotation/{api_key}:
    post:
      tags:
        - API
      summary: Change proxy rotation period
      description: 'Changes the automatic IP rotation period. Available only when the proxy has rotation_settings.rotate_can_change = true. The new value must be between rotation_settings.rotate_min and rotation_settings.rotate_max and differ from the current one.'
      operationId: changeRotation
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              required:
                - id
                - rotate
              properties:
                id:
                  description: Proxy ID
                  type: integer
                  example: 1
                rotate:
                  description: New rotation interval in minutes. 0 - rotation once a day, other values - from 2 to 60 minutes
                  type: integer
                  example: 15
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  rotation_settings:
                    description: Rotation settings after the change
                    properties:
                      rotate:
                        description: Current rotation interval in minutes. 0 = rotation once a day, any other value = every N minutes.
                        type: integer
                        example: 15
                      rotate_min:
                        description: Minimum custom rotation interval in minutes.
                        type: integer
                        example: 5
                      rotate_max:
                        description: Maximum custom rotation interval in minutes.
                        type: integer
                        example: 60
                      rotate_can_change:
                        description: Whether the rotation interval can be changed.
                        type: boolean
                        example: true
                      can_disable:
                        description: Whether automatic rotation can be disabled with rotate = 0.
                        type: boolean
                        example: true
                    type: object
                type: object
        '400':
          description: 'Error: proxy not found, proxy has no rotation, the period cannot be changed or the period is not allowed'
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Error message
                    description: Error message
                    format: string
                    example: Choose another period
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/v2/products/{api_key}:
    get:
      tags:
        - API
      summary: Search products
      operationId: searchProducts
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
        - name: country
          in: query
          description: Country
          schema:
            type: string
          example: ru
        - name: productType
          in: query
          description: Type
          schema:
            type: string
          example: server
        - name: proxyType
          in: query
          description: Proxy type
          schema:
            type: string
          example: ipv4
        - name: duration
          in: query
          description: Duration
          schema:
            type: integer
          example: 1
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
          example: 1
        - name: perPage
          in: query
          description: Number of products per page
          schema:
            type: integer
          example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        id:
                          description: Tariff ID
                          type: integer
                          example: 1
                        country:
                          description: Product country
                          type: string
                          example: ru
                        hasRotation:
                          description: Whether this product has rotation
                          type: boolean
                          example: 'false'
                        rotationPeriod:
                          description: ''
                          type: string
                          example: ''
                        speed:
                          description: Speed
                          type: string
                          example: test_password
                        totalOver:
                          description: ''
                          type: string
                          example: ''
                        proxyType:
                          description: Product proxy type
                          type: string
                          example: ipv6
                        productType:
                          description: Product type
                          type: string
                          example: proxy
                        prices:
                          description: Product price list
                          type: array
                          items:
                            properties:
                              productId:
                                description: Tariff ID
                                type: integer
                                example: 1
                              count:
                                description: Quantity (price for >= count)
                                type: integer
                                example: 10
                              price:
                                description: Price
                                type: number
                                format: float
                                example: 300
                              duration:
                                description: Duration
                                type: integer
                                example: 30
                            type: object
                      type: object
                  metadata:
                    properties:
                      page:
                        type: integer
                        example: 3
                      perPage:
                        type: integer
                        example: 10
                      lastPage:
                        type: integer
                        example: 100
                      total:
                        type: integer
                        example: 100
                    type: object
                type: object
        '400':
          description: Error
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Error message
                    description: Error message
                    format: string
                    example: The limit field is required.
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/v2/purposes/{api_key}:
    get:
      tags:
        - API
      summary: Purpose list
      operationId: purposesList
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        id:
                          description: Purpose ID
                          type: integer
                          example: 1
                        name:
                          description: Name
                          type: string
                          example: For all sites
                        name_en:
                          description: Name
                          type: string
                          example: For all sites
                      type: object
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/v2/buy-proxies/{api_key}:
    post:
      tags:
        - API
      summary: Buy proxies V2
      operationId: buyProxiesV2
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                productId:
                  description: Tariff ID
                  type: integer
                  example: 123
                duration:
                  type: integer
                  enum:
                    - 1
                    - 3
                    - 5
                    - 7
                    - 10
                    - 14
                    - 20
                    - 30
                    - 60
                    - 90
                    - 180
                    - 360
                  example: 30
                count:
                  type: integer
                  example: 1
                promoCode:
                  type: string
                  example: test
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  balance:
                    type: number
                    example: 1.5
                  code:
                    type: string
                    enum:
                      - LOW_BALANCE
                    example: LOW_BALANCE
                  order_id:
                    type: integer
                    example: 1
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/v2/traffic-prices/{api_key}:
    get:
      tags:
        - API
      summary: Traffic price list
      operationId: trafficPrices
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        traffic:
                          description: Amount of GB
                          type: integer
                          example: 1
                        price:
                          description: Price
                          type: number
                          format: float
                          example: '300'
                      type: object
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/v2/buy-traffic/{api_key}:
    post:
      tags:
        - API
      summary: Buy traffic
      operationId: buyTraffic
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              properties:
                traffic:
                  description: Amount of GB
                  type: integer
                  example: 1
                promoCode:
                  type: string
                  example: test
              type: object
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  success:
                    type: boolean
                    example: true
                  balance:
                    type: number
                    example: 1.5
                  code:
                    type: string
                    enum:
                      - LOW_BALANCE
                    example: LOW_BALANCE
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/v2/packages/{api_key}:
    get:
      tags:
        - API
      summary: Traffic package list
      operationId: packagesList
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: Page number
          schema:
            type: integer
          example: 1
        - name: perPage
          in: query
          description: Number of packages per page
          schema:
            type: integer
          example: 10
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        id:
                          description: Package ID
                          type: integer
                          example: 1
                        expires_at:
                          description: timestamp
                          type: integer
                          example: '1710367103'
                        total:
                          description: Total bytes. This field is omitted when prepaid = false.
                          type: integer
                          example: 1073741824
                        used:
                          description: Used bytes
                          type: integer
                          example: 0
                        name:
                          description: Name
                          type: string
                          example: resident shared from 2024-02-13 00:58:23
                        proxies_count:
                          description: Number of proxies in the package
                          type: integer
                          example: 1
                        is_active:
                          description: Whether the package is active. false can only be used for PayAsYouGo.
                          type: boolean
                        prepaid:
                          description: false means the package is PayAsYouGo.
                          type: boolean
                      type: object
                  metadata:
                    properties:
                      page:
                        type: integer
                        example: 3
                      perPage:
                        type: integer
                        example: 10
                      lastPage:
                        type: integer
                        example: 100
                      total:
                        type: integer
                        example: 100
                    type: object
                type: object
        '400':
          description: Error
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Error message
                    description: Error message
                    format: string
                    example: The perPage field is required.
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/v2/traffic-statistics/{api_key}:
    get:
      tags:
        - API
      summary: Traffic statistics
      operationId: trafficStatistics
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
        - name: proxy_type
          in: query
          description: Proxy type
          required: true
          schema:
            type: string
            enum:
              - resident
              - mobile
              - server
          example: resident
        - name: package_id
          in: query
          description: Traffic package ID. If omitted, statistics are returned for all matching packages.
          required: false
          schema:
            type: integer
          example: 1
        - name: from
          in: query
          description: Start date of the statistics period.
          required: true
          schema:
            type: string
          example: '2024-01-01'
        - name: to
          in: query
          description: End date of the statistics period.
          required: true
          schema:
            type: string
          example: '2024-01-31'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      properties:
                        t:
                          description: Unix timestamp for the statistics bucket.
                          type: integer
                          example: 1710367103
                        traffic:
                          description: Traffic usage in bytes.
                          type: integer
                          example: 1073741824
                      type: object
                  total:
                    description: Total traffic usage in bytes.
                    type: integer
                    example: 1073741824
                type: object
        '400':
          description: Error
          content:
            application/json:
              schema:
                properties:
                  message:
                    title: Error message
                    description: Error message
                    format: string
                    example: The proxy type field is required.
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
                    example: Invalid api_key
                  code:
                    format: integer
                    example: 0
                  status:
                    format: integer
                    example: 403
                type: object
  /dev-api/v2/package/countries/{api_key}:
    get:
      tags:
        - API
      summary: Available countries for creating a proxy in a package
      operationId: countriesList
      parameters:
        - name: api_key
          in: path
          description: API key
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  data:
                    type: array
                    items:
                      description: Country code
                      type: string
                      example: af
                type: object
        '403':
          description: Access denied
          content:
            application/json:
              schema:
                properties:
                  name:
                    format: string
                    example: Forbidden
                  message:
                    format: string
